</head><body><title>Crestline Home Inventory</title>
<style>
/* Layout: one iPhone-sized app. Full screen on a phone, a centered 393x852 device on wider screens. Deliberately light-only, like the Figma design. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1D1D1F; --sec:#6E6E73; --ter:#AEAEB2; --sep:#E3E3E8;
  --acc:#0A6CFF; --accBg:#EAF2FF; --ok:#1E9E4A; --okBg:#E6F6EC; --warn:#C25E00; --warnBg:#FFF1E0; --fill:#E9E9EE;
  --desk:#DCDCE3;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--desk);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[data-act]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.sb{display:none}
@media (min-width:520px) and (min-height:700px){
  .phone{width:393px;height:852px;max-height:calc(100% - 32px);border-radius:52px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.25)}
  .sb{display:flex;position:absolute;left:0;right:0;top:0;height:50px;z-index:50;align-items:center;justify-content:space-between;padding:6px 32px 0 40px;font-weight:600;font-size:16px;pointer-events:none}
  .sb.dark{color:#fff}
  .scr{padding-top:50px}
  .scr.cam{padding-top:0}
}
.sb .r{display:flex;gap:6px;align-items:center}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.scr.white{background:#fff}
.scr.enter{transform:translateX(100%)}
.scr.back-enter{transform:translateX(-30%);opacity:.6}
.scr.leave{transform:translateX(-30%);opacity:.6}
.scr.back-leave{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){.scr{transition:none}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.pad{padding:0 16px 24px}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g28{gap:28px}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
/* type */
.lt{font-size:34px;font-weight:700;letter-spacing:.4px;line-height:41px}
.t1{font-size:28px;font-weight:700;letter-spacing:.38px;line-height:34px;text-wrap:balance}
.t3{font-size:20px;font-weight:600;letter-spacing:-.45px}
.hl{font-size:17px;font-weight:600;letter-spacing:-.43px;line-height:22px}
.bd{font-size:17px;letter-spacing:-.43px;line-height:22px}
.sub{font-size:15px;letter-spacing:-.23px;line-height:20px}
.subM{font-size:15px;font-weight:500;letter-spacing:-.23px;line-height:20px}
.subS{font-size:15px;font-weight:600;letter-spacing:-.23px;line-height:20px}
.fn{font-size:13px;letter-spacing:-.08px;line-height:18px}
.fnM{font-size:13px;font-weight:500;letter-spacing:-.08px;line-height:18px}
.fnS{font-size:13px;font-weight:600;letter-spacing:-.08px;line-height:18px}
.cap{font-size:12px;line-height:16px}
.c2{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.sec{color:var(--sec)}.ter{color:var(--ter)}.acc{color:var(--acc)}.okc{color:var(--ok)}.warnc{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
/* nav */
.nav{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:relative}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:17px;letter-spacing:-.43px;height:44px;padding-right:8px}
.nav .mid{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.nav .right{color:var(--acc);font-size:17px;padding:0 8px}
.prog{display:flex;gap:6px;padding:2px 24px 0;flex:none}
.prog i{flex:1;height:4px;border-radius:2px;background:#DCDCE2}
.prog i.on{background:var(--acc)}
/* surfaces */
.card{background:var(--card);border-radius:14px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.grow-row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px;min-height:52px;position:relative;width:100%;text-align:left}
.grow-row+.grow-row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,48px);height:.5px;background:var(--sep)}
.tile{display:flex;align-items:center;justify-content:center;flex:none;border-radius:9px}
.lbl{padding:0 16px 8px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:-.08px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;width:100%;font-size:17px;font-weight:600;letter-spacing:-.43px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.9}
.btn.primary{background:var(--acc);color:#fff}
.btn.tinted{background:var(--accBg);color:var(--acc)}
.btn.plain{color:var(--acc);font-weight:400;height:40px}
.btn.opt{height:44px;border-radius:12px;background:var(--accBg);color:var(--acc);font-size:15px;letter-spacing:-.23px}
.foot{flex:none;background:rgba(249,249,251,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.12);padding:12px 16px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media (min-width:520px) and (min-height:700px){.foot{padding-bottom:34px}}
.foot .meta{text-align:center}
/* switch & stepper */
.sw{width:51px;height:31px;border-radius:16px;background:#E9E9EA;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw.on{background:#34C759}.sw.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px;flex:none}
.stepper button{width:40px;height:32px;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:18px;text-align:center;font-weight:600;font-size:15px}
.badge{width:20px;height:20px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.ring0{width:20px;height:20px;border-radius:50%;border:1.5px solid #C7C7CC;flex:none}
/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.opt{display:flex;align-items:center;gap:10px;height:60px;padding:0 12px;border-radius:14px;background:var(--card);text-align:left;box-shadow:inset 0 0 0 0 var(--acc);transition:box-shadow .15s}
.opt.sel{box-shadow:inset 0 0 0 2px var(--acc)}
/* sms */
.smshead{flex:none;background:rgba(247,247,249,.94);border-bottom:.5px solid rgba(0,0,0,.1);height:92px;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.smshead .bk{position:absolute;left:8px;top:8px;color:var(--acc)}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(#A8ADB8,#848A97);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.bub{background:#E9E9EB;border-radius:18px;padding:9px 14px;max-width:282px;font-size:17px;line-height:22px;letter-spacing:-.43px}
.lp{width:282px;border-radius:18px;overflow:hidden;background:#E9E9EB;text-align:left;display:block;transition:transform .12s}
.lp:active{transform:scale(.98)}
.lp .img{height:150px;background:linear-gradient(#0A6CFF,#0048B8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.lp .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 10px;background:#fff}
@media (min-width:520px) and (min-height:700px){.composer{padding-bottom:40px}}
.field{flex:1;height:36px;border-radius:18px;border:1px solid #D1D1D6;display:flex;align-items:center;padding:0 14px;color:var(--ter);font-size:17px}
/* overview */
.ringbox{position:relative;width:52px;height:52px;flex:none}
.ringbox span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bars i{height:4px;border-radius:2px;background:#E5E5EA}
.bars i.done{background:var(--ok)}.bars i.next{background:#BCD6FF}
.bars b{font-size:11px;font-weight:400;color:var(--ter);text-align:center}
.bars b.next{color:var(--acc);font-weight:600}
.upnext{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #BCD6FF;text-align:left;width:100%}
.check{width:22px;height:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
/* camera */
.cam{background:#0B0B0C;color:#fff}
.scene{position:absolute;inset:0;overflow:hidden}
.scene video{width:100%;height:100%;object-fit:cover}
.scene .wall{position:absolute;inset:0 0 38% 0}
.scene .floor{position:absolute;inset:62% 0 0 0}
.scene .win{position:absolute;border-radius:6px;background:linear-gradient(#FDF6E3,#F1E2C3);box-shadow:0 0 60px rgba(255,240,200,.45)}
.scene .f{position:absolute;border-radius:10px;filter:blur(.6px)}
.scene .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.camtop{position:absolute;top:0;left:0;right:0;z-index:5;padding:10px 14px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (min-width:520px) and (min-height:700px){.camtop{padding-top:58px}}
.camtop .x{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.recdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B30;margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.det{position:absolute;z-index:4;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.det.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.det .box{width:var(--w);height:var(--h);border-radius:14px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.det.warn .box{border-color:#FFB54D}
.det .tag{position:absolute;left:8px;top:-14px;white-space:nowrap;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;display:flex;gap:4px;align-items:center}
.det.warn .tag{background:#FFB54D;color:#3A2100}
.camsheet{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px 16px 18px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 30%);display:flex;flex-direction:column;gap:14px}
@media (min-width:520px) and (min-height:700px){.camsheet{padding-bottom:40px}}
.chips{display:flex;gap:8px;overflow:hidden;min-height:40px}
.chip{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;animation:pop .3s}
.chip.warn{background:rgba(255,181,77,.3);box-shadow:inset 0 0 0 1.5px #FFB54D}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.rec i{width:56px;height:56px;border-radius:50%;background:#FF3B30;transition:all .25s}
.rec.on i{width:28px;height:28px;border-radius:7px}
.camctl{display:flex;align-items:center;justify-content:space-between}
.camctl .side{width:96px;display:flex}
.donebtn{background:#fff;color:var(--ink);border-radius:18px;padding:8px 18px;font-weight:600;font-size:15px;margin-left:auto}
/* review */
.qbox{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;color:var(--sec)}
.seg button.sel{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tag2{font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px}
.tag2.blue{background:var(--accBg);color:var(--acc)}.tag2.red{background:#FFE9E7;color:#D12B1F}.tag2.amber{background:var(--warnBg);color:var(--warn)}
/* chat */
.thread{display:flex;flex-direction:column;gap:12px;padding:12px 16px 20px}
.ab{display:flex;gap:8px;align-items:flex-end;animation:rise .35s}
.ab .bb{background:#fff;border-radius:18px 18px 18px 6px;padding:9px 13px;max-width:296px;font-size:15px;line-height:20px;letter-spacing:-.23px}
.ub{align-self:flex-end;background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px;padding:9px 14px;font-size:15px;line-height:20px;letter-spacing:-.23px;max-width:300px;animation:rise .35s}
.conf{display:flex;gap:6px;justify-content:center;align-items:center;animation:rise .35s}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.qc{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.05);animation:rise .35s}
.items3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{position:relative;height:88px;border-radius:12px;background:var(--bg);padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.it.sel{background:var(--accBg);box-shadow:inset 0 0 0 1.5px var(--acc)}
.it.add{background:none;box-shadow:inset 0 0 0 1.2px #C7C7CC;border-radius:12px}
.it .mk{position:absolute;top:10px;right:10px}
.mic{width:38px;height:38px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(10,108,255,.2)}}
.wave{display:flex;gap:2.5px;align-items:center}
.wave i{width:2.5px;border-radius:2px;background:rgba(255,255,255,.9)}
/* alert */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.alert{width:270px;border-radius:14px;background:rgba(242,242,242,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);overflow:hidden;text-align:center;animation:zoom .25s}
@keyframes zoom{from{transform:scale(1.15);opacity:0}}
.alert .ab2{display:flex;border-top:.5px solid rgba(60,60,67,.29)}
.alert .ab2 button{flex:1;height:44px;color:#007AFF;font-size:17px}
.alert .ab2 button+button{border-left:.5px solid rgba(60,60,67,.29);font-weight:600}
.hint{width:270px;background:rgba(28,28,30,.9);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;line-height:20px;text-align:center}
/* misc */
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:80;white-space:nowrap;animation:fade .2s}
.hero{width:88px;height:88px;border-radius:50%;background:var(--okBg);display:flex;align-items:center;justify-content:center;margin:0 auto}
.tl{background:var(--bg);border-radius:18px;padding:18px 16px}
.tlr{display:flex;gap:14px}
.rail{display:flex;flex-direction:column;align-items:center;width:22px;flex:none}
.dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.dot.done{background:var(--ok)}.dot.now{background:#fff;box-shadow:inset 0 0 0 2px var(--acc)}.dot.next{background:#fff;box-shadow:inset 0 0 0 1.5px #C7C7CC}
.rail i{width:2px;height:26px;background:#D6D6DC}.rail i.done{background:var(--ok)}
.price{border-radius:20px;padding:20px 20px 18px;background:linear-gradient(#0A6CFF,#0050D0);color:#fff;display:flex;flex-direction:column;gap:14px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:rgba(255,255,255,.16);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input[type=file]{display:none}
</style>

 tips:{html:()=>`${nav('Back','<span class="fnS sec">Step 2 of 2</span>')}${prog(2,2)}<div class="body"><div class="stack g20" style="padding:14px 16px 24px">

 </div></div><div class="foot">${btn('Allow camera and start','camera','primary','camera')}${btn('I’ll do it later','toast:We’ll text you a reminder tonight','plain')}</div>`},
 rooms:{html:()=>{const done=ROOMS.filter(r=>S.done.has(r.id));const next=ROOMS.find(r=>!S.done.has(r.id));const n=done.length;const all=n===5;const C=2*Math.PI*23;
  const vol=done.reduce((a,r)=>a+r.vol,0),items=done.reduce((a,r)=>a+r.count,0);const left=ROOMS.filter(r=>!S.done.has(r.id)).length*2;
  return `<div class="body"><div class="stack g16" style="padding:12px 16px 24px">
  <div class="stack g8"><div class="row"><span class="lt grow">Your move</span><span class="tile fnS" style="width:36px;height:36px;border-radius:18px;background:#E5E5EA;color:#6E6E73">IB</span></div><span class="row g6 fn sec" style="background:#E9E9EE;border-radius:13px;padding:4px 10px;align-self:flex-start">${ic('truck',14,SEC)}Chicago → Denver  ·  Thu, 14 Nov</span></div>
  <div class="card stack g14" style="padding:16px;gap:14px"><div class="row g14" style="gap:14px"><div class="ringbox"><svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" fill="none" stroke="#E5E5EA" stroke-width="4"/><circle cx="26" cy="26" r="23" fill="none" stroke="${OK}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*n/5} ${C}" transform="rotate(-90 26 26)"/></svg><span class="num">${n}/5</span></div><div class="grow"><div class="hl">${all?'All 5 rooms done':`${n} of 5 rooms done`}</div><div class="fn sec num">${n===0?'About 10 minutes in total':all?`${items} items  ·  ≈ ${vol} cu ft`:`≈ ${vol} cu ft so far  ·  about ${left} min to go`}</div></div></div>
   <div class="bars">${ROOMS.map(r=>`<i class="${S.done.has(r.id)?'done':r===next?'next':''}"></i>`).join('')}${ROOMS.map(r=>`<b class="${r===next?'next':''}">${r.short}</b>`).join('')}</div></div>
  ${all?`<button class="upnext" data-act="go:q1">${tile('sparkle',ACCBG,ACC,44,12,24)}<div class="grow"><div class="c2 acc">Up next</div><div class="hl">A few quick questions</div><div class="fn sec">About a minute, then your summary.</div></div>${ic('chevR',16,'#AEAEB2',2.2)}</button>`
   :`<button class="upnext" data-act="scan:${next.id}">${tile(next.icon,ACCBG,ACC,44,12,24)}<div class="grow"><div class="c2 acc">Up next</div><div class="hl">${next.name}</div><div class="fn sec">${next.tip}</div></div>${ic('chevR',16,'#AEAEB2',2.2)}</button>`}
  <div class="row" style="padding:0 4px"><span class="t3 grow">All rooms</span><button class="fn acc" style="font-size:15px" data-act="toast:Add any room while filming">Add room</button></div>
  <div class="group">${ROOMS.map(r=>{const d=S.done.has(r.id);return `<button class="grow-row" style="--inset:60px;min-height:60px" data-act="scan:${r.id}">${tile(r.icon,r.tc,r.tf,32,8,18)}<div class="grow"><div class="bd">${r.name}</div><div class="fn ${!d&&r.id==='garage'?'warnc':'sec'} num">${d?`${r.count} items · ${r.vol} cu ft`:r.id==='garage'?'Often forgotten':'Not scanned yet'}</div></div>${d?`<span class="check">${ic('check',13,'#fff',3)}</span>`:ic('chevR',16,'#AEAEB2',2.2)}</button>`}).join('')}</div>
 </div></div><div class="foot">${all?btn('Continue','go:q1'):btn('Scan '+next.name.toLowerCase().replace('’','’'),'scan:'+next.id,'primary','camera')}</div>`}},
 scan:{cls:'cam',dark:true,html:id=>{const r=ROOMS.find(x=>x.id===id);const sc=r.scene;
  const vsrc=S.videos[id]||S.video;
  return `<div class="scene" id="scene">${S.stream||vsrc?`<video id="camv" autoplay playsinline muted loop></video>`:`<div class="wall" style="background:${sc.wall}"></div><div class="floor" style="background:${sc.floor}"></div><div class="win" style="left:${sc.win[0]}%;top:${sc.win[1]}%;width:${sc.win[2]}%;height:${sc.win[3]}%"></div>${sc.f.map(f=>`<div class="f" style="left:${f[0]}%;top:${f[1]}%;width:${f[2]}%;height:${f[3]}%;background:${f[4]}"></div>`).join('')}`}<div class="shade"></div></div>
  ${r.dets.map((d,i)=>`<div class="det ${d[5]?'warn':''}" id="det${i}" style="left:${d[1]}%;top:${d[2]}%;--w:${d[3]}px;--h:${d[4]}px"><div class="box"></div><div class="tag">${d[0]}</div></div>`).join('')}
  <div class="camtop"><div class="row" style="width:100%"><button class="x" data-act="back" aria-label="Close">${ic('x',18,'#fff',2.4)}</button><div class="center grow" data-act="vidpick" style="cursor:default"><div class="hl">${r.name}</div><div class="fn num" style="opacity:.85"><span id="recd" hidden class="recdot"></span><span id="tm">0:00</span></div></div><span style="width:36px"></span></div><div class="pill" id="hint">${S.stream||vsrc?'Tap record and walk slowly around the room':'Tap record to film the room with your camera'}</div></div>
  <div class="camsheet"><div class="row"><span class="hl num" id="cnt">0 items</span><span class="fn" id="chk" style="margin-left:8px;color:#FFB54D"></span><span class="fn num grow" style="text-align:right;opacity:.85" id="vol">≈ 0 cu ft</span></div>
   <div class="chips" id="chips"></div>
   <div class="camctl"><div class="side"><button class="row g4 fn" style="color:#fff" data-act="toast:Say or type what the camera missed">${ic('plus',16,'#fff',2)}Add item</button></div><button class="rec" id="rec" data-act="rec" aria-label="Record"><i></i></button><div class="side"><button class="donebtn" data-act="scandone:${id}">Done</button></div></div></div>`},
  after:(el,id)=>{const v=el.querySelector('#camv');if(v){if(S.stream){v.srcObject=S.stream;}else if(S.videos[id]||S.video){v.src=S.videos[id]||S.video;}v.play().catch(()=>{});}scanState={id,on:false,t:0,shown:0,n:0,vol:0,finished:false};}},
 review:{html:id=>{const r=ROOMS.find(x=>x.id===id);const bed=id==='bedroom';
  const rows=r.items.map(([n,k,size,v,q,tags=[]])=>`<div class="grow-row" style="--inset:60px;min-height:60px">${tile(k,BG,SEC,32,8,18)}<div class="grow"><div class="bd">${n}</div><div class="row g6 fn sec" style="flex-wrap:wrap">${size} · ${v} cu ft${q>1?' each':''}${tags.filter(t=>!t.endsWith('?')).map(t=>`<span class="tag2 ${t==='Fragile'?'red':t==='High value'?'amber':'blue'}">${t}</span>`).join('')}</div></div><div class="stepper" style="height:28px"><button style="width:30px;height:28px" aria-label="Less">${ic('minus',14,'#1D1D1F',2)}</button><span class="num fnS">${q}</span><button style="width:30px;height:28px" aria-label="More">${ic('plus',14,'#1D1D1F',2)}</button></div></div>`).join('');
  return `${nav('Rooms','<span class="hl">'+r.name+'</span>',['Edit','toast:Tap any number to change it'])}<div class="body"><div class="stack g16" style="padding:8px 16px 24px">
  <div class="card row g12" style="padding:14px 16px">${tile('play','#3A3A3C','#fff',56,10,22)}<div class="grow"><div class="fnS acc row g4">${ic('sparkle',13,ACC,2.2)}AI draft · 0:${r.secs} video</div><div class="t3 num">${r.count} items · ≈ ${r.vol} cu ft</div><div class="fn sec">${bed?'Check 2 items. A coordinator reviews the rest before your quote.':'A coordinator reviews this list before your quote.'}</div></div></div>
  ${bed?`<div class="lbl" style="padding:0 16px">Needs your check <span class="tag2 amber" style="margin-left:4px">2</span></div>
   <div class="qbox"><div class="row g12">${tile('drawer',S.bedQ.dresser?'#FFF1E0':BG,WARN,40,10,22)}<div class="grow"><div class="hl">Dresser or chest of drawers?</div><div class="fn sec">Partly behind the door at 0:31</div></div></div><div class="seg">${['Dresser','Chest of drawers','Neither'].map(o=>`<button class="${S.bedQ.dresser===o?'sel':''}" data-act="bq:dresser:${o}">${o}</button>`).join('')}</div></div>
   <div class="qbox"><div class="row g12">${tile('mirror','#FFF1E0',WARN,40,10,22)}<div class="grow"><div class="hl">Is the mirror moving with you?</div><div class="fn sec">It looks wall-mounted</div></div></div><div class="seg">${['Moving','Staying'].map(o=>`<button class="${S.bedQ.mirror===o?'sel':''}" data-act="bq:mirror:${o}">${o}</button>`).join('')}</div></div>
   <div class="lbl" style="padding:4px 16px 0">Looks right</div>`:`<div class="lbl" style="padding:0 16px">Looks right</div>`}
  <div class="group">${rows}</div></div></div>
  <div class="foot" style="flex-direction:row;align-items:center;gap:12px"><div class="stack"><span class="fnS num">${r.count} items</span><span class="fn sec num">≈ ${r.vol} cu ft</span></div><div class="grow">${btn('Confirm '+r.name.toLowerCase(),'confirm:'+id)}</div></div>`}},
 q1:{html:()=>`${helperNav(1)}<div class="body"><div class="thread">

   `<div class="row g8">${['Washer','Dryer'].map(n=>`<div class="row g8 grow" style="background:${BG};border-radius:12px;padding:8px 12px 8px 8px">${tile('washer','#fff',SEC,32,8,18)}<div><div class="fnS">${n}</div><div class="cap sec">Large · 10 cu ft</div></div></div>`).join('')}</div>
   <div class="stack g8">${['Yes, both','Only the washer','No, they’re staying'].map(o=>`<button class="btn opt" data-act="q1:${o}">${o}</button>`).join('')}</div>`)}

 q2:{html:()=>{const F=S.frag;const tiles=[['tv','tv','TV, 55 inch','Bedroom'],['mirror','mirror','Floor mirror','Bedroom'],['lamps','lamp','Table lamps','2 lamps'],['glass','wine','Glassware','2 boxes'],['art','frame','Artwork','3 pieces']];

 q3:{html:()=>{const t=totals();const sel=Object.keys(S.frag).filter(k=>S.frag[k]);const names={tv:'TV',mirror:'mirror',lamps:'lamps',glass:'glassware',art:'artwork'};const list=sel.map(k=>names[k]);const said=list.length?list.slice(0,-1).join(', ')+(list.length>1?' and ':'')+list.slice(-1):'None of them';

  const said=[crew.length?'Crew: '+crew.join(' and ')+'.':'',mine.length?'I’ll do '+mine.join(' and ')+'.':''].filter(Boolean).join(' ')||'Nothing needs taking apart.';

   :`<div class="fn sec center" style="padding-top:4px">Hold the mic to answer, or tap it for the demo.</div>`}
 </div></div>${S.voice?`<div class="foot"><div class="row g6 fn sec" style="justify-content:center">${ic('check',14,OK,2.6)}<b class="fnS" style="color:#1D1D1F">All set</b><span class="num">· ${t.items} items · ≈ ${t.vol} cu ft · 2 crew notes</span></div>${btn('See your summary','go:ready')}</div>`:composer()}`},
  after:(el,a,re)=>{const b=el.querySelector('#q4body');if(b&&S.voice)b.scrollTop=b.scrollHeight;}},

  <button class="card row g12" style="padding:12px 14px 12px 16px;text-align:left" data-act="go:ready">${tile('list',ACCBG,ACC,32,8,18)}<div class="grow"><div class="subS">Your inventory</div><div class="fn sec">5 rooms · 78 items · ≈ 640 cu ft</div></div>${ic('chevR',16,'#AEAEB2',2.2)}</button>
 </div></div><div class="foot">${btn('Book with a $350 deposit','go:booked')}${btn('Questions? Call Sam','toast:Calling Sam, (312) 555-0148','plain')}</div>`},
 booked:{cls:'white',html:()=>timeline('You’re booked','Thu, 14 Nov is yours. Crestline will move you from Chicago to Denver for a fixed $3,480.',[['done','Deposit paid','$350 today · $3,130 on moving day'],['now','Sam confirms the details','Call on Mon, 11 Nov'],['next','Packing for fragile items','Wed, 13 Nov, the day before'],['next','Moving day','Thu, 14 Nov · crew arrives 8–10 am']],'Moving something new? Add it until Mon, 11 Nov.',btn('Add to Calendar','toast:Added to your calendar')+btn('Start the demo again','restart','plain'))}
};
function timeline(title,sub,steps,note,foot){return `<div class="body"><div class="stack g28" style="padding:64px 24px 24px">
 <div class="stack g16"><div class="hero">${ic('check',44,OK,2.6)}</div><div class="stack g8 center"><div class="t1">${title}</div><div class="bd sec" style="line-height:24px">${sub}</div></div></div>
 <div class="tl">${steps.map(([st,t,s],i)=>`<div class="tlr"><div class="rail"><span class="dot ${st}">${st==='done'?ic('check',13,'#fff',3):st==='now'?`<i style="width:8px;height:8px;border-radius:4px;background:${ACC}"></i>`:''}</span>${i<steps.length-1?`<i class="${st==='done'?'done':''}"></i>`:''}</div><div style="padding-top:1px"><div class="${st==='next'?'subM sec':'subS'}">${t}</div><div class="fn sec">${s}</div></div></div>`).join('')}</div>
 <div class="fn sec center">${note}</div></div></div><div class="foot" style="background:#fff">${foot}</div>`;}

// ---------- scan logic ----------
let scanState=null;
function startRec(){const st=scanState;if(!st||st.on)return;const r=ROOMS.find(x=>x.id===st.id);st.on=true;cur.querySelector('#rec').classList.add('on');cur.querySelector('#recd').hidden=false;
 const hint=cur.querySelector('#hint');hint.textContent=(!S.stream&&S.videos[r.id])?'Finding items in your video…':r.id==='bedroom'?'Pan slowly toward the wardrobe':'Keep going, slow and steady';
 timers.push(setInterval(()=>{st.t++;const m=Math.floor(st.t/60),s=String(st.t%60).padStart(2,'0');const tm=cur.querySelector('#tm');if(tm)tm.textContent=m+':'+s;},1000));
 const steps=12;let k=0;timers.push(setInterval(()=>{if(st.finished)return;k++;showDet(Math.floor(k*r.dets.length/steps)-1);setCount(Math.round(r.count*k/steps),Math.round(r.vol*k/steps));
  if(k>=steps){finishScan();}},800));}
function showDet(upto){const r=ROOMS.find(x=>x.id===scanState.id);for(let i=0;i<=upto&&i<r.dets.length;i++){const d=cur.querySelector('#det'+i);if(d&&!d.classList.contains('on')){d.classList.add('on');const c=document.createElement('span');c.className='chip'+(r.dets[i][5]?' warn':'');const it=r.items.find(x=>x[0].toLowerCase().startsWith(r.dets[i][0].replace('?','').toLowerCase().slice(0,4)))||r.items[i];c.innerHTML=ic(it[1],20,'#fff');cur.querySelector('#chips').appendChild(c);if(r.dets[i][5])cur.querySelector('#chk').textContent='1 to check';}}}
function setCount(n,v){const c=cur.querySelector('#cnt');if(c)c.textContent=n+(n===1?' item':' items');const vv=cur.querySelector('#vol');if(vv)vv.textContent='≈ '+v+' cu ft';}
function finishScan(){const st=scanState;const r=ROOMS.find(x=>x.id===st.id);st.finished=true;showDet(99);setCount(r.count,r.vol);const h=cur.querySelector('#hint');if(h)h.textContent='Looks complete. Tap Done when you’re finished.';}

// ---------- camera ----------
async function askCamera(){
 if(S.stream){go('rooms');return;}
 if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
  try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});go('rooms');return;}catch(e){}
 }
 fakeAlert();
}
function fakeAlert(){const d=document.createElement('div');d.className='dim';d.innerHTML=`<div class="alert"><div style="padding:20px 16px 18px" class="hl">“crestline.com” Would Like to Access the Camera</div><div class="ab2"><button data-act="alert-cancel">Cancel</button><button data-act="alert-allow">Allow</button></div></div><div class="hint">Tap Allow so you can film your rooms. You can turn the camera off anytime in Settings.</div>`;phone.appendChild(d);}

// ---------- actions ----------
const vp=document.getElementById('vidpick'),vc=document.getElementById('vidcap');
vc.addEventListener('change',()=>{const f=vc.files&&vc.files[0];if(!f||curName!=='scan')return;S.videos[scanState.id]=URL.createObjectURL(f);rerender();const h=cur.querySelector('#hint');if(h)h.textContent='Finding items in your video…';setTimeout(startRec,500);});
vp.addEventListener('change',()=>{const f=vp.files&&vp.files[0];if(!f)return;S.video=URL.createObjectURL(f);toast('Room video loaded');if(curName==='scan')rerender();});
phone.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act;if(!a)return;const [cmd,...rest]=a.split(':');const arg=rest.join(':');
 switch(cmd){
  case 'back':if(curName==='scan'||curName==='review'||curName.startsWith('q')&&!['q2','q3','q4'].includes(curName)){go('rooms',null,true);}else goBack();break;
  case 'go':go(arg);break;
  case 'open-welcome':go('welcome');break;
  case 'open-quote':go('quote');break;
  case 'toast':toast(arg);break;
  case 'home':S.home=arg;rerender();break;
  case 'beds':S.beds=Math.max(0,Math.min(6,S.beds+Number(arg)));rerender();break;
  case 'stairs':S.stairs=!S.stairs;rerender();break;
  case 'camera':askCamera();break;
  case 'alert-cancel':t.closest('.dim').remove();toast('You can allow the camera when you’re ready');break;
  case 'alert-allow':t.closest('.dim').remove();go('rooms');break;
  case 'scan':go('scan',arg);break;
  case 'rec':if(scanState&&!scanState.on&&!S.stream&&!S.videos[scanState.id]&&!S.video){vc.value='';vc.click();}else if(scanState&&!scanState.on)startRec();else if(scanState&&!scanState.finished)finishScan();break;
  case 'scandone':if(scanState&&!scanState.finished){scanState.finished=true;}go('review',arg);break;
  case 'vidpick':{const now=Date.now();if(now-(t._last||0)<400){vp.click();}t._last=now;break;}
  case 'bq':{const [k,v]=arg.split(':');S.bedQ[k]=v;rerender();break;}
  case 'confirm':S.done.add(arg);go('rooms');hist=[];toast(ROOMS.find(r=>r.id===arg).name+' saved');break;
  case 'q1':S.q1=arg;go('q2');break;
  case 'frag':S.frag[arg]=S.frag[arg]?0:1;rerender();break;
  case 'apart':{const [k,v]=arg.split(':');S.apart[k]=v;rerender();break;}
  case 'mic':if(curName==='q4'&&!S.voice){t.classList.add('live');setTimeout(()=>{S.voice=true;rerender();},1400);}else toast('Hold to talk, or tap an answer');break;
  case 'restart':restart();break;
 }
});
function restart(){S.done=new Set();S.q1=null;S.voice=false;S.frag={tv:1,mirror:1,lamps:1,glass:1,art:0};S.apart={bed:'Crew',wardrobe:'Crew',bunk:'I will',table:'No need'};hist=[];curName='';go('sms');}
// dev shortcut: open #rooms, #q1, #ready etc. to jump straight to a stage
const start=(location.hash||'').slice(1);
if(start==='q1'||start==='ready'||start==='quote'){ROOMS.forEach(r=>S.done.add(r.id));S.q1='Yes, both';}
if(start==='rooms2'){S.done.add('living');S.done.add('kitchen');}
go(SCREENS[start]&&start!=='scan'&&start!=='review'?start:start==='rooms2'?'rooms':'sms');
})();
</script>
</body></html>
