<title>Crestline Home Inventory</title>
<style>
/* Layout: one iPhone-sized app. Full screen on a phone, a centered 393x852 device on wider screens. Deliberately light-only, like the Figma design. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1D1D1F; --sec:#6E6E73; --ter:#AEAEB2; --sep:#E3E3E8;
  --acc:#0A6CFF; --accBg:#EAF2FF; --ok:#1E9E4A; --okBg:#E6F6EC; --warn:#C25E00; --warnBg:#FFF1E0; --fill:#E9E9EE;
  --desk:#DCDCE3;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--desk);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[data-act]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.sb{display:none}
@media (min-width:520px) and (min-height:700px){
  .phone{width:393px;height:852px;max-height:calc(100% - 32px);border-radius:52px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.25)}
  .sb{display:flex;position:absolute;left:0;right:0;top:0;height:50px;z-index:50;align-items:center;justify-content:space-between;padding:6px 32px 0 40px;font-weight:600;font-size:16px;pointer-events:none}
  .sb.dark{color:#fff}
  .scr{padding-top:50px}
  .scr.cam{padding-top:0}
}
.sb .r{display:flex;gap:6px;align-items:center}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.scr.white{background:#fff}
.scr.enter{transform:translateX(100%)}
.scr.back-enter{transform:translateX(-30%);opacity:.6}
.scr.leave{transform:translateX(-30%);opacity:.6}
.scr.back-leave{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){.scr{transition:none}}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.pad{padding:0 16px 24px}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g28{gap:28px}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
/* type */
.lt{font-size:34px;font-weight:700;letter-spacing:.4px;line-height:41px}
.t1{font-size:28px;font-weight:700;letter-spacing:.38px;line-height:34px;text-wrap:balance}
.t3{font-size:20px;font-weight:600;letter-spacing:-.45px}
.hl{font-size:17px;font-weight:600;letter-spacing:-.43px;line-height:22px}
.bd{font-size:17px;letter-spacing:-.43px;line-height:22px}
.sub{font-size:15px;letter-spacing:-.23px;line-height:20px}
.subM{font-size:15px;font-weight:500;letter-spacing:-.23px;line-height:20px}
.subS{font-size:15px;font-weight:600;letter-spacing:-.23px;line-height:20px}
.fn{font-size:13px;letter-spacing:-.08px;line-height:18px}
.fnM{font-size:13px;font-weight:500;letter-spacing:-.08px;line-height:18px}
.fnS{font-size:13px;font-weight:600;letter-spacing:-.08px;line-height:18px}
.cap{font-size:12px;line-height:16px}
.c2{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.sec{color:var(--sec)}.ter{color:var(--ter)}.acc{color:var(--acc)}.okc{color:var(--ok)}.warnc{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
/* nav */
.nav{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:relative}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:17px;letter-spacing:-.43px;height:44px;padding-right:8px}
.nav .mid{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.nav .right{color:var(--acc);font-size:17px;padding:0 8px}
.prog{display:flex;gap:6px;padding:2px 24px 0;flex:none}
.prog i{flex:1;height:4px;border-radius:2px;background:#DCDCE2}
.prog i.on{background:var(--acc)}
/* surfaces */
.card{background:var(--card);border-radius:14px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.grow-row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px;min-height:52px;position:relative;width:100%;text-align:left}
.grow-row+.grow-row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,48px);height:.5px;background:var(--sep)}
.tile{display:flex;align-items:center;justify-content:center;flex:none;border-radius:9px}
.lbl{padding:0 16px 8px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:-.08px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;width:100%;font-size:17px;font-weight:600;letter-spacing:-.43px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.9}
.btn.primary{background:var(--acc);color:#fff}
.btn.tinted{background:var(--accBg);color:var(--acc)}
.btn.plain{color:var(--acc);font-weight:400;height:40px}
.btn.opt{height:44px;border-radius:12px;background:var(--accBg);color:var(--acc);font-size:15px;letter-spacing:-.23px}
.foot{flex:none;background:rgba(249,249,251,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.12);padding:12px 16px;display:flex;flex-direction:column;gap:6px;align-items:stretch}

.foot .meta{text-align:center}
/* switch & stepper */
.sw{width:51px;height:31px;border-radius:16px;background:#E9E9EA;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw.on{background:#34C759}.sw.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px;flex:none}
.stepper button{width:40px;height:32px;display:flex;align-items:center;justify-content:center}
.stepper button{position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.stepper button::after{content:'';position:absolute;inset:-10px -3px}.stepper button svg{pointer-events:none}.stepper button:active{opacity:.4}.stepper button:disabled{opacity:.3}
.stepper span{min-width:18px;text-align:center;font-weight:600;font-size:15px}
.badge{width:20px;height:20px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.ring0{display:block;width:20px;height:20px;border-radius:50%;border:1.5px solid #C7C7CC;flex:none}
/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.opt{display:flex;align-items:center;gap:10px;height:60px;padding:0 12px;border-radius:14px;background:var(--card);text-align:left;box-shadow:inset 0 0 0 0 var(--acc);transition:box-shadow .15s}
.opt.sel{box-shadow:inset 0 0 0 2px var(--acc)}
/* sms */
.smshead{flex:none;background:rgba(247,247,249,.94);border-bottom:.5px solid rgba(0,0,0,.1);height:92px;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.smshead .bk{position:absolute;left:8px;top:8px;color:var(--acc)}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(#A8ADB8,#848A97);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.bub{background:#E9E9EB;border-radius:18px;padding:9px 14px;max-width:282px;font-size:17px;line-height:22px;letter-spacing:-.43px}
.lp{width:282px;border-radius:18px;overflow:hidden;background:#E9E9EB;text-align:left;display:block;transition:transform .12s}
.lp:active{transform:scale(.98)}
.lp .img{height:150px;background:linear-gradient(#0A6CFF,#0048B8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.lp .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 10px;background:#fff}

.field{flex:1;height:36px;border-radius:18px;border:1px solid #D1D1D6;display:flex;align-items:center;padding:0 14px;color:var(--ter);font-size:17px}
/* overview */
.ringbox{position:relative;width:52px;height:52px;flex:none}
.ringbox span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.bars i{height:4px;border-radius:2px;background:#E5E5EA}
.bars i.done{background:var(--ok)}.bars i.next{background:#BCD6FF}
.bars b{font-size:11px;font-weight:400;color:var(--ter);text-align:center}
.bars b.next{color:var(--acc);font-weight:600}
.upnext{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #BCD6FF;text-align:left;width:100%}
.check{width:22px;height:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
/* camera */
.cam{background:#0B0B0C;color:#fff}
.scene{position:absolute;inset:0;overflow:hidden}
.scene video{width:100%;height:100%;object-fit:cover}
.scene .wall{position:absolute;inset:0 0 38% 0}
.scene .floor{position:absolute;inset:62% 0 0 0}
.scene .win{position:absolute;border-radius:6px;background:linear-gradient(#FDF6E3,#F1E2C3);box-shadow:0 0 60px rgba(255,240,200,.45)}
.scene .f{position:absolute;border-radius:10px;filter:blur(.6px)}
.scene .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.camtop{position:absolute;top:0;left:0;right:0;z-index:5;padding:10px 14px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (min-width:520px) and (min-height:700px){.camtop{padding-top:58px}}
.camtop .x{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.recdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B30;margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.det{position:absolute;z-index:4;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.det.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.det .box{width:var(--w);height:var(--h);border-radius:14px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.det.warn .box{border-color:#FFB54D}
.det .tag{position:absolute;left:8px;top:-14px;white-space:nowrap;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;display:flex;gap:4px;align-items:center}
.det.warn .tag{background:#FFB54D;color:#3A2100}
.trk{position:absolute;border:2px solid #fff;border-radius:20px;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 10px rgba(0,0,0,.2);opacity:0;transform:scale(.92);transition:opacity .3s,transform .3s cubic-bezier(.2,1.4,.4,1)}.trk.on{opacity:1;transform:none}.trk.warn{border-color:#FFB54D}.trk .tag{position:absolute;left:12px;top:-14px;white-space:nowrap;background:rgba(17,17,20,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:600;border-radius:9px;padding:4px 9px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}.trk.warn .tag{background:#FFB54D;color:#2A1700;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.camsheet{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px 16px 18px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 30%);display:flex;flex-direction:column;gap:14px}
@media (min-width:520px) and (min-height:700px){.camsheet{padding-bottom:40px}}
.chips{display:flex;gap:8px;overflow:hidden;min-height:40px}
.chip{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;animation:pop .3s}
.chip.warn{background:rgba(255,181,77,.3);box-shadow:inset 0 0 0 1.5px #FFB54D}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.rec i{width:56px;height:56px;border-radius:50%;background:#FF3B30;transition:all .25s}
.rec.on i{width:28px;height:28px;border-radius:7px}
.camctl{display:flex;align-items:center;justify-content:space-between}
.camctl .side{width:96px;display:flex}
.donebtn{background:#fff;color:var(--ink);border-radius:18px;padding:8px 18px;font-weight:600;font-size:15px;margin-left:auto}
/* review */
.qbox{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;color:var(--sec)}
.seg button.sel{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tag2{font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px}
.tag2.blue{background:var(--accBg);color:var(--acc)}.tag2.red{background:#FFE9E7;color:#D12B1F}.tag2.amber{background:var(--warnBg);color:var(--warn)}

.ab .bb{background:#fff;border-radius:18px 18px 18px 6px;padding:9px 13px;max-width:296px;font-size:15px;line-height:20px;letter-spacing:-.23px}
.ub{align-self:flex-end;background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px;padding:9px 14px;font-size:15px;line-height:20px;letter-spacing:-.23px;max-width:300px;animation:rise .35s}
.conf{display:flex;gap:6px;justify-content:center;align-items:center;animation:rise .35s}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.qc{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.05);animation:rise .35s}
.items3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{position:relative;height:88px;border-radius:12px;background:var(--bg);padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.it.sel{background:var(--accBg);box-shadow:inset 0 0 0 1.5px var(--acc)}
.it.add{background:none;box-shadow:inset 0 0 0 1.2px #C7C7CC;border-radius:12px}
.it .mk{position:absolute;top:10px;right:10px}
.mic{width:38px;height:38px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(10,108,255,.2)}}
.wave{display:flex;gap:2.5px;align-items:center}
.wave i{width:2.5px;border-radius:2px;background:rgba(255,255,255,.9)}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.alert{width:270px;border-radius:14px;background:rgba(242,242,242,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);overflow:hidden;text-align:center;animation:zoom .25s}
@keyframes zoom{from{transform:scale(1.15);opacity:0}}
.alert .ab2{display:flex;border-top:.5px solid rgba(60,60,67,.29)}
.alert .ab2 button{flex:1;height:44px;color:#007AFF;font-size:17px}
.alert .ab2 button+button{border-left:.5px solid rgba(60,60,67,.29);font-weight:600}
.dim.sheetdim{justify-content:flex-end;align-items:stretch;gap:0}
.sheet{background:#fff;border-radius:14px 14px 0 0;padding:8px 20px 34px;display:flex;flex-direction:column;gap:16px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;align-self:center}
.radio{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px #C7C7CC}
.radio.on{background:var(--acc);box-shadow:none}
.slots{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.slot{padding:8px 12px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #E3E3E8;font-size:15px;font-weight:500;letter-spacing:-.23px}
.slot.sel{background:var(--acc);color:#fff;box-shadow:none}
.hint{width:270px;background:rgba(28,28,30,.9);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;line-height:20px;text-align:center}
/* misc */
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:80;white-space:nowrap;animation:fade .2s}
.hero{width:88px;height:88px;border-radius:50%;background:var(--okBg);display:flex;align-items:center;justify-content:center;margin:0 auto}
.tl{background:var(--bg);border-radius:18px;padding:18px 16px}
.tlr{display:flex;gap:14px}
.rail{display:flex;flex-direction:column;align-items:center;width:22px;flex:none}
.dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:rgba(255,255,255,.16);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input[type=file]{display:none}

  case 'open-quote':go('quote');break;
  case 'toast':toast(arg);break;
  case 'home':S.home=arg;rerender();break;
  case 'beds':S.beds=Math.max(0,Math.min(6,S.beds+Number(arg)));rerender();break;
  case 'stairs':S.stairs=!S.stairs;rerender();break;
  case 'camera':askCamera();break;
  case 'alert-cancel':t.closest('.dim').remove();toast('You can allow the camera when you’re ready');break;
  case 'callsheet':openCallSheet();break;
  case 'cs-close':if(e.target===t)t.remove();break;
  case 'cs':if(arg==='now')S.call.now=true;else{S.call.now=false;if(arg.startsWith('slot:'))S.call.slot=+arg.slice(5);}redrawCallSheet();break;
  case 'cs-book':phone.querySelector('.sheetdim')?.remove();go('callbooked');break;
  case 'alert-allow':t.closest('.dim').remove();startFilming();break;
  case 'room':{if(S.rooms.has(arg))S.rooms.delete(arg);else S.rooms.add(arg);syncRooms();rerender();break;}
  case 'scan':go('scan',arg);break;
  case 'rec':if(scanState&&scanState.clip){if(!scanState.on)startClip();else if(!scanState.finished)finishScan();}else if(scanState&&!scanState.on&&!S.stream&&!S.videos[scanState.id]&&!S.video){vc.value='';vc.click();}else if(scanState&&!scanState.on)startRec();else if(scanState&&!scanState.finished)finishScan();break;
  case 'scandone':if(scanState&&!scanState.finished){scanState.finished=true;}go('review',arg);break;
  case 'vidpick':{const now=Date.now();if(now-(t._last||0)<400){vp.click();}t._last=now;break;}
  case 'qty':{const [rid,i,d]=arg.split(':');const r=ALL_ROOMS.find(x=>x.id===rid),it=r.items[+i],dd=+d;if(it[4]+dd<0)break;it[4]+=dd;r.count+=dd;r.vol=Math.max(0,Math.round((r.vol+dd*it[3])*10)/10);rerender();break;}
  case 'bq':{const [k,v]=arg.split(':');S.checks[k]=v;rerender();break;}
  case 'confirm':S.done.add(arg);go(ROOMS.length===1?'q1':'rooms');hist=[];toast(ROOMS.find(r=>r.id===arg).name+' saved');break;
  case 'q1':S.q1=arg;go('q2');break;
  case 'frag':S.frag[arg]=S.frag[arg]?0:1;rerender();break;
  case 'apart':{const [k,v]=arg.split(':');S.apart[k]=v;rerender();break;}
  case 'mic':if(curName==='q4'&&!S.voice){t.classList.add('live');setTimeout(()=>{S.voice=true;rerender();},1400);}else toast('Hold to talk, or tap an answer');break;
  case 'restart':restart();break;
 }
});
function restart(){S.call={now:false,slot:1};ALL_ROOMS.forEach(r=>{r.items.forEach((it,i)=>it[4]=r._q[i]);r.count=r._c;r.vol=r._v;});S.done=new Set();S.rooms=new Set(['living']);syncRooms();S.q1=null;S.voice=false;S.frag={acoustic:1,electric:1,bottles:1,power:0,tv:1,mirror:1,lamps:1,glass:1};S.checks={dresser:'Dresser',mirror:'Moving',light:'Staying'};S.apart={shelves:'Crew',desk:'I will',bed:'Crew',wardrobe:'Crew',bunk:'I will',table:'No need'};hist=[];curName='';go('sms');}
// dev shortcut: open #rooms, #q1, #ready etc. to jump straight to a stage
try{fetch('living.mp4').then(r=>r.ok?r.blob():null).then(b=>{if(b&&b.size>1000)S.clipUrl=URL.createObjectURL(b.type==='video/mp4'?b:new Blob([b],{type:'video/mp4'}));}).catch(()=>{});}catch(e){}
ALL_ROOMS.forEach(r=>{r._q=r.items.map(it=>it[4]);r._c=r.count;r._v=r.vol;});syncRooms();
const start=(location.hash||'').slice(1);
if(start==='q1'||start==='ready'||start==='quote'){ROOMS.forEach(r=>S.done.add(r.id));S.q1='Yes, both';}
if(start==='scan')go('scan','living');else go(SCREENS[start]&&start!=='review'?start:'sms');
})();
</script>
